<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Tablet camera setup</title><desc id="desc">Landscape in a secure case or mount. Side view: device faces a player with space around their head and feet. The inset shows the whole body, both shoes, and clear floor on screen.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#8aefd1"/></marker></defs><rect width="800" height="450" rx="18" fill="#102833"/><g font-family="system-ui,sans-serif" fill="#edf7f3"><text x="28" y="38" font-size="24" font-weight="700">Tablet</text><text x="28" y="65" font-size="16" fill="#b3ced0">Landscape in a secure case or mount</text><path d="M24 326H556" stroke="#64848b" stroke-width="2"/><path d="M174 172L475 94L475 322Z" fill="#8aefd1" fill-opacity=".07" stroke="#8aefd1" stroke-dasharray="6 6"/>
<g stroke="#b9d8df" stroke-width="4" fill="#294551" stroke-linejoin="round"><rect x="43" y="122" width="155" height="104" rx="10"/><rect x="52" y="130" width="135" height="86" rx="4" fill="#153a43"/><circle cx="192" cy="173" r="3" fill="#8aefd1"/><path d="M90 227L64 270H181L157 227M48 273H201V322"/></g>
<g stroke="#edc48b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="436" cy="121" r="18" fill="#edc48b" stroke="none"/><path d="M436 146L438 220M438 220L418 271L413 314M438 220L460 266L467 314M436 159L410 192L406 226M437 160L462 187"/></g><path d="M416 152L451 151L455 214L419 215Z" fill="#4cae9f"/><path d="M402 319H423M459 319H481" stroke="#ffb15f" stroke-width="9" stroke-linecap="round"/>
<path d="M211 358H470" stroke="#8aefd1" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="244" y="386" font-size="16" fill="#b3ced0">Start 2–4 m away</text><text x="28" y="422" font-size="16">Move back until your full movement fits. Keep the device out of the ball path.</text>
